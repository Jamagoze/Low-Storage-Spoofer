name: Build Storage Spoof

on:
  push:
    branches:
      - main
    paths:
      - 'storage_spoof_src.zip'
      - '.github/workflows/build.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Magisk Module
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Main Branch
        uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;27.2.12479018"
          echo "$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_PATH"

      - name: Extract Source ZIP
        run: |
          mkdir -p source
          unzip -q storage_spoof_src.zip -d source

          echo "Source extracted:"
          ls -R source

      - name: Fix Compilation Error
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("source/module/jni/storage_spoof.cpp")
          s = p.read_text()

          old = "dl_iterate_phdr(scan_cb, nullptr, nullptr);"
          new = "dl_iterate_phdr(scan_cb, nullptr);"

          count = s.count(old)

          if count:
              p.write_text(s.replace(old, new))

          print(f"Fixed {count} dl_iterate_phdr calls.")
          PY

      - name: Compile ARM64 and ARM32
        run: |
          chmod +x source/build.sh
          cd source
          ./build.sh

      - name: Verify Magisk ZIP
        run: |
          test -f source/storage_spoof.zip

          unzip -t source/storage_spoof.zip

          unzip -l source/storage_spoof.zip

      - name: Upload Magisk Module
        uses: actions/upload-artifact@v4
        with:
          name: Storage-Spoof-Magisk
          path: source/storage_spoof.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
